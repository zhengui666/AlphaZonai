<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AlphaZonai</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><aside><div class="brand"><span aria-hidden="true">α</span> AlphaZonai</div><button id="new" class="primary"></button><h2 data-i="runs"></h2><nav id="runs"></nav><label class="locale"><span data-i="language"></span><select id="lang"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></aside>
<main><p role="alert" id="error" hidden></p><section id="create"><h1 data-i="newRun"></h1><form id="form"><label><span data-i="preset"></span><select name="preset"><option value="minute" data-i="minute"></option><option value="paper" data-i="paper"></option></select></label><label><span data-i="model"></span><select name="model" required></select></label><label><span data-i="thinking"></span><select name="thinking"><option value="off">Off</option></select></label><div class="grid"><label><span data-i="startDate"></span><input name="start" type="date" required></label><label><span data-i="endDate"></span><input name="end" type="date" required></label><label><span data-i="horizon"></span><input name="horizon" type="number" min="1" value="5" required></label><label><span data-i="seed"></span><input name="seed" type="number" value="42" required></label><label class="tunable"><span data-i="generations"></span><input name="generations" type="number" min="1" placeholder="8"></label><label class="tunable"><span data-i="concurrency"></span><input name="parallel" type="number" min="1" placeholder="8"></label><label class="tunable"><span data-i="plateauWindow"></span><input name="plateauWindow" type="number" min="0" placeholder="0"></label></div><button class="primary" type="submit" data-i="run"></button></form></section><section id="detail" hidden></section></main>
</body></html>
