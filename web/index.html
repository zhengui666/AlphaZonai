<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AlphaZonai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i="skip"></a>
  <aside class="rail">
    <a class="brand" id="brand" href="#overview"><span aria-hidden="true">α</span> AlphaZonai</a>
    <nav id="navigation">
      <a href="#overview" id="overviewLink"><span aria-hidden="true">▤</span><span data-i="overview"></span></a>
      <a href="#performance/paper" id="performanceLink"><span aria-hidden="true">↗</span><span data-i="performance"></span></a>
      <a href="#settings" id="settingsLink"><span aria-hidden="true">⚙</span><span data-i="settings"></span></a>
    </nav>
    <div class="rail-reports"><h2 data-i="reports"></h2><nav id="runs"></nav></div>
    <label class="locale"><span data-i="language"></span><select id="lang"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label>
  </aside>
  <main id="main" tabindex="-1">
    <p role="alert" id="error" class="problem" hidden></p>
    <section id="overview" aria-labelledby="overviewTitle">
      <header class="mast"><div class="eyebrow" data-i="research"></div><h1 id="overviewTitle" data-i="reports"></h1></header>
      <div id="overviewContent" aria-busy="true"></div>
    </section>
    <section id="detail" hidden></section>
    <section id="performance" aria-labelledby="performanceTitle" hidden>
      <header class="mast"><h1 id="performanceTitle" data-i="performanceTitle"></h1></header>
      <div class="review-controls">
        <nav id="reviewModes" class="review-modes" aria-labelledby="performanceTitle">
          <a href="#performance/paper" data-i="paperTrading"></a>
          <a href="#performance/live" data-i="liveTrading"></a>
        </nav>
        <label id="reviewPicker" hidden><span data-i="tradingSession"></span><select id="reviewSession"></select></label>
        <button id="reviewRefresh" type="button" data-i="refreshReports"></button>
      </div>
      <div id="reviewContent" aria-busy="true"></div>
    </section>
    <section id="settings" aria-labelledby="settingsTitle" hidden>
      <header class="mast"><h1 id="settingsTitle" data-i="settings"></h1></header>
      <nav id="settingsNav" class="review-modes" aria-labelledby="settingsTitle">
        <a href="#settings" data-i="modelSettings"></a>
        <a href="#settings/nautilus" data-i="nautilusSettings"></a>
        <a href="#settings/review" data-i="reviewSettings"></a>
        <a href="#settings/data" data-i="dataSettings"></a>
      </nav>
      <p id="settingsNotice" role="status"></p>
      <div id="settings-model" class="settings-grid" hidden>
        <section class="panel settings-card">
          <h2>ChatGPT</h2>
          <div class="actions">
            <button id="chatGPTStart" type="button" data-i="chatGPTStart"></button>
            <button id="chatGPTCancel" type="button" data-i="chatGPTCancel" hidden></button>
            <button id="chatGPTDisconnect" type="button" data-i="chatGPTDisconnect" hidden></button>
          </div>
          <p id="chatGPTDevice" role="status" hidden><a id="chatGPTLink" target="_blank" rel="noopener noreferrer" data-i="chatGPTOpen"></a> <code id="chatGPTCode"></code></p>
          <p id="chatGPTStatus" role="status"></p>
        </section>
        <section class="panel settings-card">
          <h2>OpenAI API</h2><p id="modelConnection" role="status"></p>
          <form id="modelKeyForm">
            <label><span data-i="modelApiKey"></span><input name="key" type="password" autocomplete="off" spellcheck="false" required></label>
            <div class="actions">
              <button class="primary" data-i="connectModel" type="submit"></button>
              <button data-i="disconnectModel" id="disconnectModel" type="button"></button>
              <button data-i="refreshModels" id="refreshModels" type="button"></button>
            </div>
          </form>
        </section>
        <section class="panel settings-card">
          <h2 data-i="defaultModel"></h2>
          <form id="modelDefaultsForm">
            <label><span data-i="model"></span><select name="model" required></select></label>
            <label><span data-i="thinking"></span><select name="thinking"></select></label>
            <label><span data-i="speed"></span><select name="speed"></select></label>
            <button class="primary" data-i="saveModelDefaults" type="submit"></button>
          </form>
        </section>
      </div>
      <section id="settings-nautilus" class="panel settings-card" aria-labelledby="nautilusTitle" hidden>
        <h2 id="nautilusTitle" data-i="nautilusSettings"></h2>
        <form id="nautilusForm">
          <label><span data-i="pythonInterpreter"></span><input name="python" spellcheck="false" required></label>
          <label><span data-i="strategyToken"></span><input name="strategyToken" type="password" autocomplete="new-password" spellcheck="false"></label>
          <label class="check" hidden><input name="clearToken" type="checkbox"><span data-i="clearToken"></span></label>
          <h3 data-i="strategyTargets"></h3>
          <div id="targetList"></div>
          <button id="addTarget" type="button" data-i="addTarget"></button>
          <button type="submit" class="primary" data-i="saveSettings"></button>
        </form>
      </section>
      <template id="targetTemplate">
        <fieldset class="target">
          <legend data-i="strategyTarget"></legend>
          <div class="field-pair">
            <label><span data-i="targetId"></span><input name="id" spellcheck="false" required></label>
            <label><span data-i="targetLabel"></span><input name="label" required></label>
            <label><span data-i="targetKind"></span><select name="kind"><option value="local" data-i="localTarget"></option><option value="ssh">SSH</option></select></label>
            <label><span data-i="targetRole"></span><select name="role"><option value="backtest" data-i="backtestRole"></option><option value="deploy" data-i="deployRole"></option><option value="both" data-i="bothRoles"></option></select></label>
          </div>
          <label><span data-i="localProfile"></span><input name="profile" spellcheck="false" required></label>
          <label><span data-i="sshAlias"></span><input name="alias" spellcheck="false" required></label>
          <label><span data-i="sshConfig"></span><input name="sshConfig" spellcheck="false" required></label>
          <label><span data-i="marketContext"></span><textarea name="marketContext" rows="2" maxlength="3000"></textarea></label>
          <button type="button" data-i="removeTarget"></button>
        </fieldset>
      </template>
      <section id="settings-review" class="panel settings-card" aria-labelledby="reviewSettingsTitle" hidden>
        <h2 id="reviewSettingsTitle" data-i="reviewSettings"></h2>
        <form id="reviewForm">
          <label class="check"><input name="enabled" type="checkbox"><span data-i="enableDailyReview"></span></label>
          <label><span data-i="reviewTime"></span><input name="time" type="time" required></label>
          <label><span data-i="reviewLanguage"></span><select name="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
          <label><span data-i="defaultReviewObjective"></span><textarea name="objective" rows="3" maxlength="2000"></textarea></label>
          <button type="submit" class="primary" data-i="saveSettings"></button>
        </form>
      </section>
      <section id="settings-data" class="panel settings-card" aria-labelledby="dataSettingsTitle" hidden>
        <h2 id="dataSettingsTitle" data-i="dataSettings"></h2>
        <form id="dataForm">
          <label><span data-i="catalogPath"></span><input name="catalog" spellcheck="false" required></label>
          <label><span data-i="agentToken"></span><input name="agentToken" type="password" autocomplete="new-password" spellcheck="false"></label>
          <label class="check" hidden><input name="clearToken" type="checkbox"><span data-i="clearToken"></span></label>
          <label><span data-i="stateDirectory"></span><input name="stateDir" spellcheck="false" required></label>
          <div class="field-pair">
            <label><span data-i="listenHost"></span><input name="host" spellcheck="false" required></label>
            <label><span data-i="listenPort"></span><input name="port" type="number" min="1" max="65535" required></label>
          </div>
          <p class="subtle" data-i="restartSettings"></p>
          <div class="field-pair">
            <label><span data-i="accessTeam"></span><input name="accessTeam" placeholder="my-team" spellcheck="false" autocapitalize="none" aria-describedby="accessHint"></label>
            <label><span data-i="accessAud"></span><input name="accessAud" spellcheck="false" autocapitalize="none" aria-describedby="accessHint"></label>
          </div>
          <p id="accessHint" class="subtle" data-i="accessHint"></p>
          <button class="primary" type="submit" data-i="saveSettings"></button>
        </form>
      </section>
      <p id="settingsFeedback" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
