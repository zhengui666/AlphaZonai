name: Container Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts && pip install -r quant/requirements.txt && npm test
      - name: Build release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build -t "$image" .
          echo "ALPHA_RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Start release image and read health
        run: bash tests/check_image.sh "$ALPHA_RELEASE_IMAGE" http
      - name: Execute isolated factor inside the release image
        run: bash tests/check_image.sh "$ALPHA_RELEASE_IMAGE" isolated
      - name: Push the tested image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$ALPHA_RELEASE_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$ALPHA_RELEASE_IMAGE"
